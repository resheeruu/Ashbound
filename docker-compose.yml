version: "3.8"
services:
  ashbound:
    build: .
    ports:
      - "${PORT:-9002}:9002"
    environment:
      - NODE_ENV=production
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - AI_API_KEY=${AI_API_KEY}
      - DATABASE_URL=file:./data/ashbound.db
    volumes:
      - ashbound-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  ashbound-data:
